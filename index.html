<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club 5 to 7</title>
    <meta name="description" content="Club 5 to 7 — a film club based in Addis. Links, events and film picks now live at 5to7.club.">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://5to7.club/">
    <link rel="icon" type="image/jpeg" href="img/Logo.jpg">

    <!-- Open Graph (for anyone still sharing this old link) -->
    <meta property="og:title" content="Club 5 to 7">
    <meta property="og:description" content="Club 5 to 7 — a film club based in Addis. Links, events and film picks at 5to7.club.">
    <meta property="og:image" content="img/Logo.jpg">
    <meta property="og:url" content="https://5to7.club/">
    <meta property="og:type" content="website">

    <!--
      This page used to be the club's link-in-bio (themed per event: Third
      Cinema, Women in Cinema, The Tortured Artist…). Since 2026-09-06 the
      link-in-bio lives on the website itself at https://5to7.club/ — this
      page only forwards there so old links in bios and posts keep working.
    -->
    <meta http-equiv="refresh" content="0; url=https://5to7.club/">
    <script>
        window.location.replace("https://5to7.club/");
    </script>

    <style>
        :root { --ink: #2c3849; --ink-soft: #64748b; --accent: #5b7c99; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 18px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(158deg, #f5f7fa 0%, #dbe4ef 48%, #c3cfe2 100%);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        .avatar {
            width: 96px; height: 96px;
            border-radius: 50%;
            object-fit: cover;
            padding: 5px;
            background: #fff;
            box-shadow: 0 14px 30px rgba(44, 56, 73, 0.16);
        }
        h1 { font-size: 1.8rem; margin: 20px 0 6px; letter-spacing: -0.01em; }
        p { margin: 0; color: var(--ink-soft); font-size: 1.02rem; }
        a.go {
            display: inline-block;
            margin-top: 22px;
            padding: 13px 22px;
            border-radius: 14px;
            background: #fff;
            color: var(--ink);
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(44, 56, 73, 0.1);
        }
        a.go:hover { color: var(--accent); }
    </style>
</head>

<body>
    <img src="img/Logo.jpg" alt="Club 5 to 7" class="avatar">
    <h1>Club 5 to 7</h1>
    <p>We've moved. Taking you to 5to7.club&hellip;</p>
    <a class="go" href="https://5to7.club/">Continue to 5to7.club &rarr;</a>
</body>

</html>
